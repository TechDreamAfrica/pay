<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Pay TechDream Africa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    colors: { primary: { DEFAULT:'#0F766E',600:'#0F766E',700:'#0B5C56' }, secondary:'#1E293B', accent:'#2563EB' },
    fontFamily: { display: ['Sora','sans-serif'], body: ['Inter','sans-serif'] },
  }}};
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-body bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen">
<div class="min-h-screen flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-8">
      <h1 class="font-display font-bold text-2xl text-secondary dark:text-white">Set a new password</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Choose a strong password you haven't used before.</p>
      <form id="reset-form" class="mt-6 space-y-4">
        <input required type="password" name="password" minlength="8" placeholder="New password" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary-600 outline-none">
        <input required type="password" name="confirm" minlength="8" placeholder="Confirm new password" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary-600 outline-none">
        <button type="submit" class="w-full rounded-lg bg-primary-600 text-white font-semibold py-3 hover:bg-primary-700 transition-colors">Update Password</button>
      </form>
    </div>
  </div>
</div>
<script type="module">
  import { updatePassword } from './js/auth.js';
  import { initTheme, toast } from './js/ui.js';
  initTheme();
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (fd.get('password') !== fd.get('confirm')) return toast('Passwords do not match.', 'error');
    try { await updatePassword(fd.get('password')); toast('Password updated — you can sign in now.', 'success'); setTimeout(() => (location.href = 'login.html'), 1200); }
    catch (err) { toast(err.message || 'Could not update password. Request a new link.', 'error'); }
  });
</script>
</body>
</html>
